[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-coach"
version = "0.1.0"
description = "A low-effort, proactive, behaviour-aware personal fitness coach."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21,<23",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "google-genai>=1.30",
    "icalendar>=6",
    "recurring-ical-events>=3",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "anthropic>=0.40", "openai>=1.40"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["coach*"]

[tool.setuptools.package-data]
coach = ["nutrition/data/*.csv"]
