# Builds, tests and publishes the signed Android APK as a GitHub Release on every push to master
# that touches the app. The app's in-app updater reads the latest release.
name: Android release

on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: fitcoach # not a secret: as a secret it would mask "fitcoach" in every log line
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAJOR=$(grep '^versionMajor=' version.properties | cut -d= -f2)
          MINOR=$(grep '^versionMinor=' version.properties | cut -d= -f2)
          VERSION="$MAJOR.$MINOR.$BUILD_NUMBER"
          APK="FitCoach-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          gh release create "v$VERSION" "$APK" "$APK.sha256" \
            --title "FitCoach $VERSION" --target "$GITHUB_SHA" --generate-notes

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: android/app/build/reports/tests/
